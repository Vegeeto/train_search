<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Unofficial live departures and journey planner for FGC trains, using FGC Open Data." />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)" />
    <title>Trens FGC</title>
    <script>
      // Apply the saved theme before first paint, so a forced theme never flashes.
      // Mirrors src/lib/theme.ts; the cookie format lives in src/lib/storage.ts.
      (function () {
        try {
          var m = document.cookie.match(/(?:^|;\s*)fgc_prefs=([^;]*)/);
          var theme = m && JSON.parse(decodeURIComponent(m[1])).theme;
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.dataset.theme = theme;
            var color = theme === 'dark' ? '#0e1014' : '#f4f5f7';
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (el) {
              el.setAttribute('content', color);
            });
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚆</text></svg>">
    <script type="module" crossorigin src="./assets/index-CjIjFMx4.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-j4SlxKes.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
