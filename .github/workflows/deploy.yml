name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# contents: write is required: the deploy action pushes the build to the gh-pages branch.
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install, test and build 🔧
        run: |
          npm ci
          npm test
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
